const q=document.getElementById('q'), list=document.getElementById('list'), count=document.getElementById('count');
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(n);
function render(){
 const term=q.value.trim().toLocaleLowerCase('es-MX');
 const rows=products.filter(p=>p.name.toLocaleLowerCase('es-MX').includes(term));
 count.textContent=rows.length.toLocaleString('es-MX')+' productos';
 if(!rows.length){list.innerHTML='<div class="empty">No se encontraron productos.</div>';return;}
 list.innerHTML=rows.map(p=>`<article class="item"><div><div class="name">${escapeHtml(p.name)}</div><div class="stock ${p.stock===0?'zero':''}">${p.stock===0?'Sin existencia':'Existencia: '+p.stock}</div></div><div class="price">${money(p.price)}</div></article>`).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
q.addEventListener('input',render);render();
</script></body></html>
