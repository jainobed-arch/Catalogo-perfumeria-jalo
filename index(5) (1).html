const q=document.getElementById('q'), list=document.getElementById('list'), count=document.getElementById('count');
const photoFilter=document.getElementById('photo-filter');
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(n);
function render(){
 const term=q.value.trim().toLocaleLowerCase('es-MX');
 const rows=products.filter(p=>p.name.toLocaleLowerCase('es-MX').includes(term) &&
   (!photoFilter.checked || photosByCode[p.code]));
 count.textContent=rows.length.toLocaleString('es-MX')+' productos';
 if(!rows.length){list.innerHTML='<div class="empty">No se encontraron productos.</div>';return;}
 list.innerHTML=rows.map(p=>{
   const photo=photosByCode[p.code];
   const image=photo ? `<img class="product-photo" src="${photo.image}" width="68" height="68" loading="lazy" decoding="async" alt="">` : '';
   return `<article class="item"><div class="product">${image}<div><div class="name">${escapeHtml(p.name)}</div><div class="stock ${p.stock===0?'zero':''}">${p.stock===0?'Agotado':'Existencia: '+p.stock}</div></div></div><div class="price">${money(p.price)}</div></article>`;
 }).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
q.addEventListener('input',render);
photoFilter.addEventListener('change',render);
render();
</script></body></html>
